[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-universal-perception"
version = "0.1.0"
description = "Cross-game universal visual perception research framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "pydantic>=2.0", "Pillow>=10.0"]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17", "opencv-python>=4.9", "transformers>=4.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
